<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Каталог товаров</title>
  </head>
  <body>
    <div class="container">
      <!-- Создать кнопку "Регистрация". -->
      <button id="open-register-btn" class="register-trigger-btn">
        Регистрация
      </button>

      <!-- Создать модальное окно, используя классы "modal, modal-showed". 
Логика такая: при нажатии на кнопку у нас открывается модальное окно путем добавления modal-showed к div с классом modal. 
1.Задний фон должен быть затемнён, но не полностью черный 
(Создаем класс overlay, который будет затемнять всю страницу)
2 .Модальное окно находиться ровно по центру страницы, независимо от масштаба -->
      <div id="modal-overlay" class="overlay">
        <div class="modal">
          <!-- Не забываем добавить кнопку для закрытия модалки (крестик в углу) -->
          <button class="modal__close" id="close-modal-btn">&times;</button>
          <!-- Создать форму для регистрации внутри модального окна. 
Она должна содержать поля: имя, фамилия, дата рождения, логин, пароль, повторение пароля. 
Используйте для того, что бы указать пользователю, какое поле за что отвечает. 
Также важно использовать placeholder -->
          <form class="register-form" id="register-form" novalidate>
            <h2 class="register-form__title">Регистрация</h2>

            <div class="form-group">
              <label for="reg-firstname">Имя</label>
              <input
                type="text"
                id="reg-firstname"
                name="firstname"
                required
                placeholder="Рустем"
              />
            </div>

            <div class="form-group">
              <label for="reg-lastname">Фамилия</label>
              <input
                type="text"
                id="reg-lastname"
                name="lastname"
                required
                placeholder="Нигмати"
              />
            </div>
            
            <div class="form-group">
              <label for="reg-email">Email</label>
              <input
                type="email"
                id="reg-email"
                name="email"
                required
                placeholder="rustem@example.com"
              />
            </div>

            <div class="form-group">
              <label for="reg-dob">Дата рождения</label>
              <input 
                type="date" 
                id="reg-dob" 
                name="dob" 
                required />
            </div>

            <div class="form-group">
              <label for="reg-login">Логин</label>
              <input
                type="text"
                id="reg-login"
                name="login"
                required
                minlength="4"
                placeholder="рустем78"
              />
            </div>

            <div class="form-group">
              <label for="reg-password">Пароль</label>
              <input
                type="password"
                id="reg-password"
                name="password"
                required
                minlength="10"
                placeholder="Минимум 10 символов"
              />
            </div>

            <div class="form-group">
              <label for="reg-confirm-password">Повторите пароль</label>
              <input
                type="password"
                id="reg-confirm-password"
                name="confirm-password"
                required
                minlength="10"
                placeholder="Минимум 10 символов"
              />
            </div>

            <button type="submit" class="register-form__btn">
              Зарегистрироваться
            </button>
          </form>
        </div>
      </div>

      <h1 class="title">Выбери свой продукт</h1>
      <button class="btn-color">Покрасить первую карточку</button>
      <button class="btn-color-all">Покрасить все карточки</button>
      <button class="btn-google">Поискать в Google</button>
      <button class="btn-message">Показать сообщение</button>
      <button class="btn-toggle">Кнопка переключения</button>

      <!-- 2.По аналогии из лекции — создать и реализовать шаблон для продуктовых карточек. (Посмотрите сразу задание 5) -->
      <ul class="product-list"></ul>

      <template id="product-card-template">
        <li class="product-list__card product-card">
          <img
            class="product-card__image"
            src="product.src"
            alt="product.alt"
            width="290"
          />
          <p class="product-card__description"></p>
          <h2 class="product-card__name"></h2>
          <p class="product-card__text"></p>
          <span>Состав:</span>
          <ul class="product-card__composition"></ul>
          <div class="product-card__price-box">
            <b>Цена</b>
            <span class="product-card__price"></span>
          </div>
        </li>
      </template>
    </div>
    <footer class="footer">
      <div class="footer__grid">
        <div class="footer__col footer__col--left">
          <h2 class="footer__col-title-left">Product Cards</h2>
          <p class="footer__col-text">У нас самые лучшие продукты для кожи!</p>
          <div class="footer__socials">
            <!-- Ссылки на социальные сети -->
            <a
              href="https://t.me"
              target="_blank"
              class="footer__social-link"
              aria-label="Telegram"
            >
              <svg
                class="footer__social-icon"
                width="21"
                height="18"
                viewBox="0 0 21 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M20.9379 1.60272L17.7692 16.5465C17.5299 17.601 16.9067 17.8635 16.0209 17.367L11.1924 13.809L8.86293 16.05C8.60493 16.308 8.38968 16.5232 7.89243 16.5232L8.23968 11.6062L17.1879 3.52047C17.5772 3.17397 17.1032 2.98122 16.5834 3.32847L5.52093 10.2945L0.758428 8.80347C-0.277322 8.48022 -0.296072 7.76772 0.974428 7.27047L19.6022 0.0937215C20.4647 -0.229529 21.2192 0.285721 20.9379 1.60347V1.60272Z"
                  fill="white"
                />
              </svg>
            </a>
            <a
              href="https://vk.com"
              class="footer__social-link"
              target="_blank"
              aria-label="ВКонтакте"
            >
              <svg
                class="footer__social-icon"
                width="24"
                height="14"
                viewBox="0 0 24 14"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M23.45 0.948C23.616 0.402 23.45 0 22.655 0H20.03C19.362 0 19.054 0.347 18.887 0.73C18.887 0.73 17.552 3.926 15.661 6.002C15.049 6.604 14.771 6.795 14.437 6.795C14.27 6.795 14.019 6.604 14.019 6.057V0.948C14.019 0.292 13.835 0 13.279 0H9.151C8.734 0 8.483 0.304 8.483 0.593C8.483 1.214 9.429 1.358 9.526 3.106V6.904C9.526 7.737 9.373 7.888 9.039 7.888C8.149 7.888 5.984 4.677 4.699 1.003C4.45 0.288 4.198 0 3.527 0H0.9C0.15 0 0 0.347 0 0.73C0 1.412 0.89 4.8 4.145 9.281C6.315 12.341 9.37 14 12.153 14C13.822 14 14.028 13.632 14.028 12.997V10.684C14.028 9.947 14.186 9.8 14.715 9.8C15.105 9.8 15.772 9.992 17.33 11.467C19.11 13.216 19.403 14 20.405 14H23.03C23.78 14 24.156 13.632 23.94 12.904C23.702 12.18 22.852 11.129 21.725 9.882C21.113 9.172 20.195 8.407 19.916 8.024C19.527 7.533 19.638 7.314 19.916 6.877C19.916 6.877 23.116 2.451 23.449 0.948H23.45Z"
                  fill="white"
                />
              </svg>
            </a>
          </div>
        </div>

        <div class="footer__col footer__col--center">
          <h2 class="footer__col-title-center">Подпишись на наши акции:</h2>
          <form
            action="#"
            class="subscribe-form"
            id="subscribeForm"
            autocomplete="off"
            novalidate
          >
            <div class="subscribe-form__field">
              <input
                type="email"
                class="subscribe-form__input"
                id="subscribeEmail"
                placeholder="Введи Email..."
                required
                aria-label="Ваш Email"
              />
            </div>
            <button type="submit" class="subscribe-form__btn">
              Подписаться
            </button>
          </form>
        </div>

        <div class="footer__col footer__col--right">
          <div class="footer__col-title-wrapper">
            <h2 class="footer__col-title-right">Быстрые ссылки</h2>
            <nav class="footer__menu">
              <ul class="footer__menu-list">
                <li class="footer__menu-item">
                  <a href="/" class="footer__menu-link">Главная</a>
                </li>
                <li class="footer__menu-item">
                  <a href="/shop" class="footer__menu-link">Магазин</a>
                </li>
                <li class="footer__menu-item">
                  <a href="/contacts" class="footer__menu-link">Контакты</a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
      <div class="footer__bottom">
        <p class="footer__copyright">
          www.product-cards.com &copy; all right reserve
        </p>
      </div>
    </footer>
    <script src="index.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
    <script type="module" src="homework-11.js"></script>
  </body>
</html>
